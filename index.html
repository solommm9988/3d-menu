<!DOCTYPE html>
<html lang="en" dir="ltr" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>L'ÉLITE GASTRONOMIE | Luxury Digital Menu</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldLight: '#F7E7A9',
              darkBg: '#050608',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            brand: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050608;
      color: #F3F4F6;
      overflow-x: hidden;
      width: 100%;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y; /* Smooth native vertical scrolling */
    }

    /* Hardware-Accelerated 4K Video Background */
    .video-bg-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform;
    }
    .video-bg-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5) contrast(1.15) saturate(1.25);
    }

    .overlay-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(5,6,8,0.2) 0%, rgba(5,6,8,0.7) 75%, #050608 100%),
                  linear-gradient(to bottom, rgba(5,6,8,0.3) 0%, transparent 40%, rgba(5,6,8,0.9) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* Ultra-lightweight high-performance card styling */
    .glass-luxury {
      background: rgba(14, 17, 26, 0.82);
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transform: translateZ(0);
    }
    
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #F7E7A9 45%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #E6C65B 0%, #D4AF37 50%, #AA820A 100%);
      color: #050608;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transform: translateZ(0);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

<body x-data="clientApp()" x-init="initApp()" class="w-full relative pb-32">

  <!-- 4K Background Video -->
  <div class="video-bg-container">
    <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1920&q=80">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-top-view-of-a-steak-on-a-wooden-board-42512-large.mp4" type="video/mp4">
    </video>
  </div>
  <div class="overlay-vignette"></div>

  <!-- Hero Section -->
  <section class="min-h-[50vh] flex flex-col justify-between items-center text-center px-4 pt-6 pb-4 relative z-10">
    <div class="w-full max-w-md flex justify-between items-center">
      <span class="px-3.5 py-1 rounded-full bg-black/50 border border-brand-gold/40 text-[11px] font-bold text-brand-goldLight">
        <i class="fa-solid fa-crown text-[10px] mr-1"></i> Fine Dining Experience
      </span>
      <button @click="waiterModalOpen = true" class="px-3.5 py-1.5 rounded-2xl bg-amber-500/25 border border-amber-500/50 text-amber-300 text-xs font-black flex items-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-bell text-xs"></i>
        <span>Call Waiter</span>
      </button>
    </div>

    <!-- Center Brand Identity -->
    <div class="space-y-3 my-auto py-4">
      <div class="w-20 h-20 rounded-3xl overflow-hidden mx-auto border-2 border-brand-gold/50 shadow-2xl bg-black/60 p-1 flex items-center justify-center">
        <template x-if="settings.logo_url">
          <img :src="settings.logo_url" alt="Logo" class="w-full h-full object-cover rounded-2xl">
        </template>
        <template x-if="!settings.logo_url">
          <div class="w-full h-full rounded-2xl gold-btn flex items-center justify-center text-black text-2xl">
            <i class="fa-solid fa-crown"></i>
          </div>
        </template>
      </div>
      <h1 class="font-brand text-2xl md:text-4xl font-black gold-gradient-text tracking-wider uppercase leading-none" x-text="settings.restaurant_name"></h1>
      <p class="text-xs md:text-sm text-gray-300 font-semibold max-w-xs mx-auto drop-shadow" x-text="settings.tagline"></p>
    </div>

    <a href="#menu-content" class="flex flex-col items-center gap-1 text-gray-300 hover:text-brand-gold transition duration-300">
      <span class="text-[10px] font-bold tracking-widest uppercase text-brand-goldLight">Explore Menu</span>
      <div class="w-6 h-9 rounded-full border-2 border-brand-gold/50 flex items-start justify-center p-1">
        <div class="w-1.5 h-2 bg-brand-gold rounded-full animate-bounce"></div>
      </div>
    </a>
  </section>

  <!-- Main Menu Area -->
  <div id="menu-content" class="w-full max-w-lg mx-auto px-3.5 pt-2">

    <!-- Sticky Header Bar -->
    <header class="w-full py-2 px-3 rounded-2xl glass-luxury sticky top-2 z-40 mb-3 flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl overflow-hidden border border-brand-gold/40 flex-shrink-0 bg-black/40 flex items-center justify-center">
          <template x-if="settings.logo_url">
            <img :src="settings.logo_url" alt="Logo" class="w-full h-full object-cover">
          </template>
          <template x-if="!settings.logo_url">
            <div class="w-full h-full gold-btn flex items-center justify-center text-black text-xs">
              <i class="fa-solid fa-crown"></i>
            </div>
          </template>
        </div>
        <div class="min-w-0">
          <h2 class="font-brand text-xs font-black gold-gradient-text truncate leading-tight uppercase" x-text="settings.restaurant_name"></h2>
          <span class="text-[9px] text-gray-400 font-semibold block truncate" x-text="settings.tagline"></span>
        </div>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button @click="infoModalOpen = true" class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-300">
          <i class="fa-solid fa-location-dot text-xs text-rose-400"></i>
        </button>
        <button @click="waiterModalOpen = true" class="px-3 py-1.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold flex items-center gap-1">
          <i class="fa-solid fa-bell text-xs"></i>
          <span>Waiter</span>
        </button>
      </div>
    </header>

    <!-- Quick Action Pills -->
    <div class="grid grid-cols-3 gap-2 mb-3 w-full">
      <button @click="waiterModalOpen = true" class="py-2 rounded-xl glass-luxury text-[11px] font-bold text-gray-200 flex items-center justify-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-receipt text-emerald-400"></i> Bill
      </button>
      <button @click="infoModalOpen = true" class="py-2 rounded-xl glass-luxury text-[11px] font-bold text-gray-200 flex items-center justify-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-location-dot text-rose-400"></i> Location
      </button>
      <button @click="reviewModalOpen = true" class="py-2 rounded-xl glass-luxury text-[11px] font-bold text-gray-200 flex items-center justify-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-star text-amber-400"></i> Review
      </button>
    </div>

    <!-- Live Order Tracker -->
    <template x-if="activeOrder">
      <div class="mb-4 p-3.5 rounded-2xl glass-luxury border-brand-gold/50 shadow-2xl">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
            <span class="text-xs font-bold text-brand-goldLight">Table #<span x-text="activeOrder.table_number"></span> (Order #<span x-text="activeOrder.id"></span>)</span>
          </div>
          <span class="text-xs font-black text-brand-gold" x-text="activeOrder.total + ' ' + (settings.currency || '')"></span>
        </div>

        <div class="grid grid-cols-4 text-center gap-1 text-[10px] font-bold">
          <div :class="['received', 'preparing', 'on_way', 'served'].includes(activeOrder.status) ? 'text-brand-gold' : 'text-gray-400'">
            <i class="fa-solid fa-clipboard-check text-xs mb-1 block"></i> Received
          </div>
          <div :class="['preparing', 'on_way', 'served'].includes(activeOrder.status) ? 'text-brand-gold' : 'text-gray-400'">
            <i class="fa-solid fa-fire-burner text-xs mb-1 block"></i> Kitchen
          </div>
          <div :class="['on_way', 'served'].includes(activeOrder.status) ? 'text-brand-gold' : 'text-gray-400'">
            <i class="fa-solid fa-person-walking-luggage text-xs mb-1 block"></i> On Way
          </div>
          <div :class="activeOrder.status === 'served' ? 'text-emerald-400' : 'text-gray-400'">
            <i class="fa-solid fa-check-double text-xs mb-1 block"></i> Served
          </div>
        </div>
      </div>
    </template>

    <!-- Search Box -->
    <div class="mb-3">
      <input type="text" x-model="searchQuery" placeholder="Search your favorite dish..." class="w-full py-2.5 px-4 rounded-xl glass-luxury text-xs text-white placeholder-gray-400 focus:outline-none focus:border-brand-gold">
    </div>

    <!-- Category Swipe Tabs (Hardware accelerated horizontal carousel) -->
    <div class="sticky top-14 z-30 mb-4 py-1"
         @touchstart="handleTouchStart($event)"
         @touchend="handleTouchEnd($event)">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar p-1.5 glass-luxury rounded-2xl border-brand-gold/30">
        <template x-for="cat in categories" :key="cat.id">
          <button @click="activeCategory = cat.id" :class="activeCategory === cat.id ? 'gold-btn' : 'text-gray-200'" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap flex items-center gap-1.5 transition">
            <span x-html="cat.icon || '<i class=\'fa-solid fa-utensils\'></i>'"></span>
            <span x-text="cat.name"></span>
          </button>
        </template>
      </div>
      <div class="text-[9px] text-gray-400 text-center mt-1.5 flex items-center justify-center gap-1">
        <i class="fa-solid fa-arrows-left-right text-brand-gold"></i> Swipe horizontally on categories to navigate
      </div>
    </div>

    <!-- Dishes Grid with Lazy Loading -->
    <div class="grid grid-cols-1 gap-4">
      <template x-for="dish in filteredDishes" :key="dish.id">
        <div class="glass-luxury rounded-3xl overflow-hidden border border-white/15 flex flex-col justify-between group">
          <div class="relative h-48 w-full overflow-hidden bg-black/40">
            <img :src="dish.image" loading="lazy" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#050608]/90 via-transparent to-black/20"></div>
            <template x-if="dish.badge">
              <span class="absolute top-2.5 left-2.5 px-2.5 py-0.5 rounded-full text-[10px] font-black gold-btn" x-text="dish.badge"></span>
            </template>
          </div>
          <div class="p-4">
            <div class="flex justify-between items-center mb-1.5">
              <h3 class="font-bold text-white text-base" x-text="dish.title"></h3>
              <span class="font-black text-brand-gold text-base" x-text="dish.price + ' ' + (settings.currency || '')"></span>
            </div>
            <p class="text-gray-300 text-xs line-clamp-2 leading-relaxed mb-3.5" x-text="dish.description"></p>
            
            <button @click="openCustomModal(dish)" class="w-full py-2.5 rounded-xl gold-btn text-xs flex items-center justify-center gap-2">
              <i class="fa-solid fa-sliders"></i>
              <span x-text="dish.variants && dish.variants.length > 0 ? 'Select Size & Add' : 'Add to Order'"></span>
            </button>
          </div>
        </div>
      </template>
    </div>

  </div>

  <!-- Customization Modal -->
  <div x-show="customModalOpen" x-transition.opacity class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-end justify-center p-0">
    <div @click.away="customModalOpen = false" class="glass-luxury w-full max-w-lg rounded-t-3xl p-5 max-h-[85vh] flex flex-col justify-between border-brand-gold/30">
      <template x-if="selectedDish">
        <div>
          <div class="flex justify-between items-center pb-3 border-b border-white/10 mb-3">
            <div>
              <h3 class="font-bold text-white text-sm" x-text="selectedDish.title"></h3>
              <span class="text-[11px] text-gray-400">Choose size & quantity</span>
            </div>
            <button @click="customModalOpen = false" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <div class="space-y-3 my-4">
            <template x-if="selectedDish.variants && selectedDish.variants.length > 0">
              <div>
                <label class="block text-xs font-bold text-brand-gold mb-2">Select Size / Type:</label>
                <div class="grid grid-cols-2 gap-2">
                  <template x-for="(v, idx) in selectedDish.variants" :key="idx">
                    <button 
                      @click="selectedVariant = v"
                      :class="selectedVariant && selectedVariant.name === v.name ? 'gold-btn' : 'bg-white/5 border border-white/10 text-gray-300'"
                      class="p-2.5 rounded-xl text-xs font-bold flex justify-between items-center transition">
                      <span x-text="v.name"></span>
                      <span x-text="v.price + ' ' + (settings.currency || '')"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>

            <div class="flex justify-between items-center bg-white/5 p-3 rounded-2xl border border-white/5">
              <span class="text-xs font-bold text-white">Quantity:</span>
              <div class="flex items-center gap-3 bg-black/60 px-3 py-1.5 rounded-xl">
                <button @click="customQty > 1 ? customQty-- : null" class="text-gray-400 px-2 font-bold text-sm">-</button>
                <span class="text-xs font-bold text-white" x-text="customQty"></span>
                <button @click="customQty++" class="text-brand-gold px-2 font-bold text-sm">+</button>
              </div>
            </div>
          </div>

          <button @click="addConfiguredToCart()" class="w-full py-3.5 rounded-xl gold-btn text-xs font-black flex items-center justify-center gap-2 mt-3">
            <span>Add to Order (<span x-text="((selectedVariant ? selectedVariant.price : selectedDish.price) * customQty) + ' ' + (settings.currency || '')"></span>)</span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- Floating Cart Bar -->
  <div x-show="cart.length > 0" class="fixed bottom-3 inset-x-3 max-w-lg mx-auto z-40">
    <div class="glass-luxury border-brand-gold/50 p-2.5 rounded-2xl flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl gold-btn flex items-center justify-center text-xs font-black" x-text="cartCount"></div>
        <div>
          <span class="text-[9px] text-gray-400 block">Total</span>
          <span class="text-xs font-black text-brand-goldLight" x-text="cartTotal + ' ' + (settings.currency || '')"></span>
        </div>
      </div>
      <button @click="cartOpen = true" class="px-4 py-2 rounded-xl gold-btn text-xs font-black">
        View Order <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div x-show="cartOpen" x-transition.opacity class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-end justify-center p-0">
    <div @click.away="cartOpen = false" class="glass-luxury w-full max-w-lg rounded-t-3xl p-5 max-h-[90vh] flex flex-col justify-between border-brand-gold/30">
      <div>
        <div class="flex justify-between items-center pb-3 border-b border-white/10 mb-3">
          <h3 class="font-bold text-white text-sm">Review & Confirm Order</h3>
          <button @click="cartOpen = false" class="text-gray-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="space-y-2 overflow-y-auto max-h-[30vh] pr-1">
          <template x-for="item in cart" :key="item.cartId">
            <div class="p-2.5 rounded-xl bg-white/5 flex items-center justify-between">
              <div>
                <h4 class="text-xs font-bold text-white" x-text="item.title + (item.variantName ? ' (' + item.variantName + ')' : '')"></h4>
                <span class="text-[11px] text-brand-gold font-bold" x-text="(item.price * item.qty) + ' ' + (settings.currency || '')"></span>
              </div>
              <div class="flex items-center gap-2 bg-black/60 px-2 py-1 rounded-lg">
                <button @click="updateQty(item.cartId, -1)" class="text-gray-400 px-1 font-bold">-</button>
                <span class="text-xs font-bold text-white" x-text="item.qty"></span>
                <button @click="updateQty(item.cartId, 1)" class="text-brand-gold px-1 font-bold">+</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="pt-3 border-t border-white/10 space-y-2.5">
        <div>
          <label class="block text-[11px] font-bold text-brand-goldLight mb-1">Table Number <span class="text-rose-400">*</span></label>
          <input type="number" x-model="tableNumber" required placeholder="e.g. 5" class="w-full p-2.5 rounded-xl bg-black/70 border border-brand-gold/50 text-xs text-white focus:outline-none focus:border-brand-gold">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-brand-goldLight mb-1">Your Name <span class="text-rose-400">*</span></label>
            <input type="text" x-model="customerName" required placeholder="Full Name" class="w-full p-2.5 rounded-xl bg-black/70 border border-brand-gold/50 text-xs text-white focus:outline-none focus:border-brand-gold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-brand-goldLight mb-1">Phone Number <span class="text-rose-400">*</span></label>
            <input type="tel" x-model="customerPhone" required placeholder="Phone Number" class="w-full p-2.5 rounded-xl bg-black/70 border border-brand-gold/50 text-xs text-white focus:outline-none focus:border-brand-gold">
          </div>
        </div>

        <button @click="submitOrder()" :disabled="submitting" class="w-full py-3.5 rounded-xl gold-btn text-xs font-black flex items-center justify-center gap-2 mt-2">
          <span x-show="!submitting">Confirm Order (<span x-text="cartTotal + ' ' + (settings.currency || '')"></span>)</span>
          <span x-show="submitting"><i class="fa-solid fa-spinner fa-spin"></i> Placing Order...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Waiter Modal -->
  <div x-show="waiterModalOpen" x-transition.opacity class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.away="waiterModalOpen = false" class="glass-luxury w-full max-w-xs rounded-3xl p-5 border-brand-gold/30 space-y-3 text-center">
      <h3 class="font-bold text-white text-sm">Call Waiter</h3>
      <div>
        <label class="block text-[11px] text-gray-400 mb-1">Enter Table Number:</label>
        <input type="number" x-model="tableNumber" placeholder="Table #" class="w-24 mx-auto p-2 rounded-xl bg-black/60 border border-brand-gold/50 text-center font-bold text-brand-gold text-sm focus:outline-none">
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button @click="callWaiter('Assistance Required')" class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-200">🙋‍♂️ Call Waiter</button>
        <button @click="callWaiter('Mineral Water')" class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-200">💧 Water</button>
        <button @click="callWaiter('Request Bill (Cash/Card)')" class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-200 col-span-2">💳 Request Bill</button>
      </div>
      <button @click="waiterModalOpen = false" class="text-xs text-gray-400">Cancel</button>
    </div>
  </div>

  <!-- Info Modal -->
  <div x-show="infoModalOpen" x-transition.opacity class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.away="infoModalOpen = false" class="glass-luxury w-full max-w-sm rounded-3xl p-5 border-brand-gold/30 space-y-4">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="font-bold text-white text-sm">Location & Contacts</h3>
        <button @click="infoModalOpen = false" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <template x-if="settings.google_maps_url">
        <a :href="settings.google_maps_url" target="_blank" class="w-full py-3 rounded-2xl bg-rose-500/20 border border-rose-500/40 text-rose-300 font-bold text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-map-location-dot text-base"></i> Open on Google Maps
        </a>
      </template>

      <div class="flex justify-center gap-3 pt-2 text-xl text-brand-gold flex-wrap">
        <template x-if="settings.phone">
          <a :href="'tel:' + settings.phone" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center hover:scale-105 transition"><i class="fa-solid fa-phone"></i></a>
        </template>
        <template x-if="settings.whatsapp">
          <a :href="'https://wa.me/' + settings.whatsapp" target="_blank" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-emerald-400 hover:scale-105 transition"><i class="fa-brands fa-whatsapp"></i></a>
        </template>
        <template x-if="settings.facebook">
          <a :href="settings.facebook" target="_blank" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-blue-400 hover:scale-105 transition"><i class="fa-brands fa-facebook"></i></a>
        </template>
        <template x-if="settings.instagram">
          <a :href="settings.instagram" target="_blank" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-pink-400 hover:scale-105 transition"><i class="fa-brands fa-instagram"></i></a>
        </template>
        <template x-if="settings.tiktok">
          <a :href="settings.tiktok" target="_blank" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-200 hover:scale-105 transition"><i class="fa-brands fa-tiktok"></i></a>
        </template>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div x-show="reviewModalOpen" x-transition.opacity class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.away="reviewModalOpen = false" class="glass-luxury w-full max-w-xs rounded-3xl p-5 border-brand-gold/30 space-y-3.5 text-center">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 text-2xl flex items-center justify-center mx-auto border border-emerald-500/40">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <h3 class="font-bold text-white text-base">Order Placed!</h3>
        <p class="text-[11px] text-gray-300 mt-0.5">Please rate your experience while we prepare your meal.</p>
      </div>

      <template x-if="settings.google_review_url">
        <a :href="settings.google_review_url" target="_blank" class="w-full py-2.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold text-xs flex items-center justify-center gap-2">
          <i class="fa-brands fa-google text-sm"></i> Review on Google Maps ⭐
        </a>
      </template>

      <div class="border-t border-white/10 pt-2 text-left">
        <span class="text-[10px] text-gray-400 block mb-1">Internal Feedback:</span>
        <div class="flex justify-center gap-2 text-xl text-amber-400 my-2">
          <template x-for="star in 5" :key="star">
            <i class="fa-star cursor-pointer" :class="star <= newRating ? 'fa-solid' : 'fa-regular'" @click="newRating = star"></i>
          </template>
        </div>
        <textarea x-model="reviewText" placeholder="Tell us your feedback..." class="w-full p-2 rounded-xl bg-black/40 border border-white/10 text-xs text-white h-16 focus:outline-none"></textarea>
        <button @click="submitReview()" class="w-full py-2 rounded-xl gold-btn text-xs font-black mt-2">Submit Feedback</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://okbpsgwvqlsisdeezcjy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ldXj3mZJTKdgqnVcmQ6CVA_KJcIgFCd";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function clientApp() {
      return {
        tableNumber: '',
        customerName: '',
        customerPhone: '',
        settings: {
          restaurant_name: "L'ÉLITE GASTRONOMIE",
          tagline: "Fine Dining Experience",
          logo_url: "",
          currency: "",
          phone: "",
          whatsapp: "",
          google_maps_url: "",
          google_review_url: "",
          facebook: "",
          instagram: "",
          tiktok: ""
        },
        categories: [],
        dishes: [],
        activeCategory: 'all',
        searchQuery: '',
        cart: [],
        cartOpen: false,
        submitting: false,
        activeOrder: null,
        waiterModalOpen: false,
        infoModalOpen: false,
        reviewModalOpen: false,
        newRating: 5,
        reviewText: '',
        customModalOpen: false,
        selectedDish: null,
        selectedVariant: null,
        customQty: 1,
        touchStartX: 0,
        touchEndX: 0,

        async initApp() {
          const params = new URLSearchParams(window.location.search);
          if (params.has('table')) this.tableNumber = params.get('table');

          await this.loadSettings();
          await this.loadCategories();
          await this.loadDishes();
          this.listenToUpdates();
        },

        handleTouchStart(e) {
          this.touchStartX = e.changedTouches[0].screenX;
        },

        handleTouchEnd(e) {
          this.touchEndX = e.changedTouches[0].screenX;
          this.handleSwipe();
        },

        handleSwipe() {
          const diff = this.touchEndX - this.touchStartX;
          if (Math.abs(diff) < 40) return;

          const currentIndex = this.categories.findIndex(c => c.id === this.activeCategory);
          if (currentIndex === -1) return;

          if (diff > 0) {
            if (currentIndex > 0) this.activeCategory = this.categories[currentIndex - 1].id;
          } else {
            if (currentIndex < this.categories.length - 1) this.activeCategory = this.categories[currentIndex + 1].id;
          }
        },

        async loadSettings() {
          const { data } = await supabaseClient.from('restaurant_settings').select('*').limit(1).maybeSingle();
          if (data) {
            this.settings = { ...this.settings, ...data };
          }
        },

        async loadCategories() {
          const { data } = await supabaseClient.from('categories').select('*').order('sort_order', { ascending: true });
          if (data && data.length > 0) {
            this.categories = [{ id: 'all', name: 'All', icon: '<i class="fa-solid fa-utensils"></i>' }, ...data];
          } else {
            this.categories = [{ id: 'all', name: 'All', icon: '<i class="fa-solid fa-utensils"></i>' }];
          }
        },

        async loadDishes() {
          const { data } = await supabaseClient.from('dishes').select('*').eq('is_available', true);
          if (data) this.dishes = data;
        },

        get filteredDishes() {
          return this.dishes.filter(d => {
            const matchesCat = this.activeCategory === 'all' || d.category === this.activeCategory;
            const matchesSearch = d.title.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCat && matchesSearch;
          });
        },

        openCustomModal(dish) {
          this.selectedDish = dish;
          this.customQty = 1;
          if (dish.variants && dish.variants.length > 0) {
            this.selectedVariant = dish.variants[0];
          } else {
            this.selectedVariant = null;
          }
          this.customModalOpen = true;
        },

        addConfiguredToCart() {
          const price = this.selectedVariant ? this.selectedVariant.price : this.selectedDish.price;
          const variantName = this.selectedVariant ? this.selectedVariant.name : '';
          const cartId = `${this.selectedDish.id}_${variantName}`;

          const existing = this.cart.find(i => i.cartId === cartId);
          if (existing) {
            existing.qty += this.customQty;
          } else {
            this.cart.push({
              cartId,
              id: this.selectedDish.id,
              title: this.selectedDish.title,
              variantName,
              price: Number(price),
              qty: this.customQty
            });
          }
          this.customModalOpen = false;
        },

        updateQty(cartId, delta) {
          const item = this.cart.find(i => i.cartId === cartId);
          if (item) {
            item.qty += delta;
            if (item.qty <= 0) this.cart = this.cart.filter(i => i.cartId !== cartId);
          }
        },

        get cartCount() { return this.cart.reduce((s, i) => s + i.qty, 0); },
        get cartTotal() { return this.cart.reduce((s, i) => s + (i.price * i.qty), 0); },

        async submitOrder() {
          if (!this.tableNumber || !this.customerName || !this.customerPhone) {
            alert("Please fill in Table Number, Your Name, and Phone Number!");
            return;
          }
          if (this.cart.length === 0) return;

          this.submitting = true;
          const subtotal = this.cartTotal;
          const tax = Math.round(subtotal * ((this.settings.tax_rate || 14) / 100));
          const total = subtotal + tax;

          const { data, error } = await supabaseClient.from('orders').insert([{
            table_number: String(this.tableNumber),
            customer_name: this.customerName,
            customer_phone: this.customerPhone,
            items: this.cart,
            subtotal,
            tax,
            total,
            status: 'received'
          }]).select();

          this.submitting = false;
          if (!error && data && data.length > 0) {
            this.activeOrder = data[0];
            this.cart = [];
            this.cartOpen = false;
            this.reviewModalOpen = true;
          } else {
            alert("Error sending order, please try again.");
          }
        },

        listenToUpdates() {
          supabaseClient.channel('order-tracking')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, payload => {
              if (this.activeOrder && payload.new.id === this.activeOrder.id) {
                this.activeOrder = payload.new;
              }
            }).subscribe();

          supabaseClient.channel('settings-tracking')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'restaurant_settings' }, payload => {
              if (payload.new) {
                this.settings = { ...this.settings, ...payload.new };
              }
            }).subscribe();

          supabaseClient.channel('categories-tracking')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => {
              this.loadCategories();
            }).subscribe();

          supabaseClient.channel('dishes-tracking')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'dishes' }, () => {
              this.loadDishes();
            }).subscribe();
        },

        async callWaiter(reqType) {
          if (!this.tableNumber) {
            alert("Please enter your table number first!");
            return;
          }
          await supabaseClient.from('waiter_calls').insert([{
            table_number: String(this.tableNumber),
            request_type: reqType,
            status: 'pending'
          }]);
          this.waiterModalOpen = false;
          alert("Waiter has been notified!");
        },

        async submitReview() {
          await supabaseClient.from('reviews').insert([{
            customer_name: this.customerName || 'Customer',
            table_number: String(this.tableNumber || '-'),
            rating: this.newRating,
            comment: this.reviewText
          }]);
          this.reviewModalOpen = false;
          this.reviewText = '';
          alert("Thank you for your rating!");
        }
      };
    }
  </script>
</body>
</html>
